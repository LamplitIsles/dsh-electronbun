<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktop host</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-rounded, "Microsoft YaHei UI", "Noto Sans CJK SC", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 12% 12%, #255b78, transparent 28rem), #10141c; color: #edf2f7; }
      main { width: min(600px, calc(100vw - 48px)); padding: 32px; border: 1px solid #334155; border-radius: 16px; background: #172033e8; box-shadow: 0 18px 60px #0006; }
      h1 { margin-top: 0; font-size: 1.35rem; }
      p { color: #b7c3d4; line-height: 1.5; white-space: pre-wrap; }
      #error { color: #fecaca; }
      button { border: 0; border-radius: 8px; padding: 10px 16px; background: #4f8cff; color: white; font: inherit; cursor: pointer; margin-right: 8px; }
      button[hidden] { display: none; }
      button.secondary { background: #334155; }
      label { display: block; margin: 16px 0 6px; color: #b7c3d4; font-size: .9rem; }
      input { width: 100%; padding: 10px 12px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: inherit; font: inherit; }
      input:focus { outline: 2px solid #4f8cff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <h1 id="title">Starting desktop host</h1>
      <p id="status">Checking the supported runtime…</p>
      <p id="error" hidden></p>
      <div>
        <button id="install" hidden>Install Bun</button>
        <button id="retry" class="secondary" hidden>Retry</button>
      </div>
      <form id="launch-token-form" hidden autocomplete="off">
        <label for="launch-token">启动令牌</label>
        <input id="launch-token" type="password" required maxlength="2048" autocomplete="off" spellcheck="false">
        <button id="continue" type="submit">继续</button>
      </form>
    </main>
    <script>
      (() => {
        const status = document.getElementById("status");
        const error = document.getElementById("error");
        const install = document.getElementById("install");
        const retry = document.getElementById("retry");
        const tokenForm = document.getElementById("launch-token-form");
        const token = document.getElementById("launch-token");
        const continueButton = document.getElementById("continue");
        const send = (action, payload = {}) => window.__electrobunSendToHost?.({ action, ...payload });
        install.addEventListener("click", () => send("install-bun"));
        retry.addEventListener("click", () => send("retry"));
        tokenForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const value = token.value;
          token.value = "";
          send("submit-launch-token", value ? { token: value } : {});
        });
        window.__dshHostState = (kind, value) => {
          if (kind === "loading") {
            document.title = value.appName ? `Starting ${value.appName}` : "Desktop host";
            document.getElementById("title").textContent = value.appName ? `Starting ${value.appName}` : "Starting desktop host";
            status.textContent = value.message || "Starting…";
            error.hidden = true;
            install.hidden = true;
            retry.hidden = true;
            tokenForm.hidden = true;
          } else if (kind === "failed") {
            document.title = value.appName || "Desktop host";
            document.getElementById("title").textContent = value.appName || "Desktop host";
            status.textContent = "The desktop host could not start the sidecar.";
            error.textContent = value.diagnostic || "Unknown startup error";
            error.hidden = false;
            install.hidden = !value.canInstall;
            install.textContent = value.bunVersion ? `Install Bun ${value.bunVersion}` : "Install Bun";
            retry.hidden = !value.canRetry;
            tokenForm.hidden = true;
          } else if (kind === "launch-token") {
            document.title = "DSH 启动令牌";
            document.getElementById("title").textContent = "输入 DSH 启动令牌";
            status.textContent = value.message || "从 DSH Web 进程日志粘贴一次性启动令牌。令牌仅用于本次验证，不会保存。";
            error.hidden = true;
            install.hidden = true;
            retry.hidden = true;
            tokenForm.hidden = false;
            continueButton.disabled = value.message === "Verifying launch token…";
            if (!continueButton.disabled) token.focus();
          }
        };
      })();
    </script>
  </body>
</html>
